version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      # 本体の更新はまとめて 1 本の PR にする
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      timezone: Asia/Tokyo
    groups:
      actions:
        patterns: ['*']
