version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    ignore:
      # @astrojs/check が TypeScript 7 に未対応（peer dependency が ^5 || ^6）のため、対応するまでメジャー更新を止める
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      # 本体の更新はまとめて 1 本の PR にする
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      timezone: Asia/Tokyo
    groups:
      actions:
        patterns: ['*']
