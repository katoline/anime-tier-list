name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: ビルド
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          # text（画像なし・既定）/ image（画像あり）。権利確認が取れたら image に変える
          PUBLIC_IMAGE_MODE: ${{ vars.IMAGE_MODE || 'text' }}
          PUBLIC_ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          PUBLIC_ADSENSE_SLOT_DEFAULT: ${{ vars.ADSENSE_SLOT_DEFAULT }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          PUBLIC_OPERATOR_NAME: ${{ vars.OPERATOR_NAME }}
          PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: npm run build
      - name: D1 のマイグレーション
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote
      - name: デプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
