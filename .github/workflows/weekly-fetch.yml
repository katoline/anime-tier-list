name: 今期アニメの週次取得

on:
  schedule:
    # 毎週月曜 4:00 JST（日曜 19:00 UTC）
    - cron: '0 19 * * 0'
  workflow_dispatch:
    inputs:
      season:
        description: '季節 ID（例: 2026-fall）。空なら今の季節'
        required: false

permissions:
  contents: read

concurrency:
  group: weekly-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN で作った PR では CI が動かないため、GitHub App のトークンを使う
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: AniList から取得して画像を R2 へアップロード
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'anime-tier-images' }}
        run: |
          if [ -n "${{ inputs.season }}" ]; then
            node scripts/fetch-season.mjs --season "${{ inputs.season }}" --upload s3
          else
            node scripts/fetch-season.mjs --upload s3
          fi

      - run: node scripts/validate-data.mjs

      - name: PR を作成
        id: pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ steps.app.outputs.token }}
          branch: bot/weekly-anime-data
          delete-branch: true
          commit-message: '作品データを更新'
          title: '今期アニメの作品データを更新'
          body: |
            週次の自動取得で作品データが変わりました。CI が通れば自動でマージされます。
            （作品数が前回の半分未満になった場合などは CI が失敗し、マージされません）
          labels: automated

      - name: 自動マージを有効にする
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh pr merge --auto --merge "${{ steps.pr.outputs.pull-request-number }}"
